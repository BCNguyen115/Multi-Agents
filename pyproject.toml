# Tooling configuration only (the project is not a distributable package).
[tool.ruff]
target-version = "py312"
extend-exclude = ["legacy", "frontend", "scripts/dev"]

[tool.ruff.lint]
# A deliberately small gate: real bugs (syntax errors, undefined names, redefined functions), not style.
# Widen it (F401 unused imports has ~56 hits today) once those are cleaned up.
select = ["E9", "F63", "F7", "F82", "F811"]
