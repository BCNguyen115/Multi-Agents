# Production-like stack. Secrets come from `.env` (copy .env.example) — none are hardcoded here.
#   docker compose up -d --build                                                  # run
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build     # hot-reload backend
#
# NOTE: the compose project name is intentionally not pinned, so existing named volumes keep working.

x-restart: &restart
  restart: unless-stopped

# Shared Postgres/Redis wiring for both Langfuse containers
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-agentdb}?schema=langfuse&connection_limit=25
  DIRECT_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentdb}?schema=langfuse
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_CONNECTION_STRING: redis://default:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (hex, no special characters)}@redis:6379
  REDIS_AUTH: ${REDIS_PASSWORD}
  NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Set LANGFUSE_NEXTAUTH_SECRET in .env}
  SALT: ${LANGFUSE_SALT:?Set LANGFUSE_SALT in .env}
  TELEMETRY_ENABLED: "false"

services:
  # 1. PostgreSQL + pgvector
  postgres:
    <<: *restart
    image: ${POSTGRES_IMAGE:-ankane/pgvector:latest}  # pin a tag per environment; a major-version change needs a dump/restore
    container_name: agent_postgres
    command: postgres -c max_connections=250 -c shared_buffers=256MB -c idle_in_transaction_session_timeout=60000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agentdb}
    ports:
      - "127.0.0.1:5432:5432"   # host access for local tooling only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Redis — cache / session state (DB 0) and Langfuse queue
  redis:
    <<: *restart
    image: redis:8-alpine  # the existing redis_data volume was written by Redis 8 (RDB v15); an older major cannot load it
    container_name: agent_redis
    # Everything on the Docker network can reach Redis, and it holds pending approvals, chat history, cached files and the
    # rate-limit counters: it asks for a password. Use a URL-safe one (e.g. `openssl rand -hex 24`).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (hex, no special characters)}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}   # lets the health check below log in
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Backend: FastAPI gateway + PEV orchestrator
  backend:
    <<: *restart
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_BROWSER: ${INSTALL_BROWSER:-true}
    image: agent-backend:latest
    container_name: agent_backend
    env_file:
      - path: .env
        required: false
    environment:   # service-network values override anything in .env
      POSTGRES_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentdb}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_ENV: ${APP_ENV:-production}   # production refuses AUTH_MODE=off and hides /docs (EXPOSE_API_DOCS=true shows it)
      AUTH_MODE: ${AUTH_MODE:-jwt}      # secure by default; AUTH_MODE=off only for a local trial
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_HOST: http://langfuse-web:3000
      MEM0_VECTOR_STORE: pgvector   # long-term memory in PostgreSQL: it survives restarts
      # Which peers may tell the backend a visitor's real address (X-Forwarded-For). Default: nobody, so the backend sees the
      # frontend's address for everyone. Behind a reverse proxy that OVERWRITES the header, set this to the frontend's address
      # or network (e.g. 172.18.0.0/16); never "*" while the backend port is reachable by clients.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      DB_AGENT_PASSWORD: ${DB_AGENT_PASSWORD:-}   # >= 16 chars: the Database Agent then runs SQL as a read-only role
      RERANKER_ENDPOINT: http://tei-reranker:80/rerank
      SANDBOX_URL: http://python-sandbox:8080     # LLM-written analysis code runs there, not next to the API's secrets
      SANDBOX_SECRET: ${SANDBOX_SECRET:?set SANDBOX_SECRET in .env (at least 16 random characters)}
    networks: [default, sandbox_net]
    ports:
      - "127.0.0.1:8000:8000"   # the browser talks to the frontend (Next rewrites /api); expose this only behind an authenticating proxy
    volumes:
      - ./dataset:/app/dataset   # documents for ingestion; ingestion writes its walkthrough report here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      langfuse-web:   # tracing is optional: start after it is up so the keys are checked against a live server, but never block on it
        condition: service_healthy
        required: false

  # 4. Frontend: Next.js 14 (rewrites /api/* to the backend)
  frontend:
    <<: *restart
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
    image: agent-frontend:latest
    container_name: agent_frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:3001:3000"   # behind a TLS proxy set FRONTEND_BIND=127.0.0.1 (deploy/nginx-tls.example.conf)
    depends_on:
      backend:
        condition: service_healthy

  # 5. Langfuse web — LLM observability
  langfuse-web:
    <<: *restart
    image: langfuse/langfuse:2
    container_name: agent_langfuse_web
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3005
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      # Headless provisioning (created once, skipped when they already exist): the project's API keys are the SAME
      # LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY the backend uses, so tracing works without clicking through the UI.
      LANGFUSE_INIT_ORG_ID: multi-agent
      LANGFUSE_INIT_ORG_NAME: Multi-Agent
      LANGFUSE_INIT_PROJECT_ID: multi-agent-mvp
      LANGFUSE_INIT_PROJECT_NAME: Multi-Agent MVP
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname -i):3000/api/public/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5b. Langfuse worker — async queue
  langfuse-worker:
    <<: *restart
    image: langfuse/langfuse-worker:2
    container_name: agent_langfuse_worker
    environment:
      <<: *langfuse-env
      NEXT_MANUAL_SIGHANDLE: "true"
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 6. TEI cross-encoder reranker
  tei-reranker:
    <<: *restart
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.2
    container_name: agent_reranker
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - reranker_data:/data
    command: --model-id BAAI/bge-reranker-base --auto-truncate

  # 7. Analysis sandbox: runs the Data Agent's LLM-written pandas code (src/agents/data_agent/sandbox_server.py).
  # It sits on an internal-only network (no route to the internet, no database, no Redis): only the backend can reach it,
  # and every request must carry an HMAC signature made with SANDBOX_SECRET.
  python-sandbox:
    <<: *restart
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: agent-sandbox:latest
    container_name: agent_python_sandbox
    environment:
      SANDBOX_SECRET: ${SANDBOX_SECRET:?set SANDBOX_SECRET in .env (at least 16 random characters)}
      MPLCONFIGDIR: /tmp/mpl
    networks: [sandbox_net]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
          pids: 128

networks:
  sandbox_net:
    internal: true   # no gateway: containers on it cannot reach the internet

volumes:
  postgres_data:
  redis_data:
  reranker_data:
