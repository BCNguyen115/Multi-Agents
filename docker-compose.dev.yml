# Developer override: backend hot-reload against your working tree.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    command: uvicorn src.gateway.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src
    environment:
      LOG_LEVEL: DEBUG
    volumes:
      - ./src:/app/src
