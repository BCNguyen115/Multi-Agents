# Security scans. Not yet run on GitHub itself: written against the project layout and the audits run locally.
#   dependencies: `npm audit` BLOCKS (0 vulnerabilities in the runtime dependencies: image-size and Next's postcss are pinned by
#                 `overrides` in frontend/package.json; drop an override when its parent ships the fix). pip-audit is still informational:
#                 run it locally once, fix what it finds, then remove its `continue-on-error`.
#   secrets:      blocking. A false positive goes into .gitleaks.toml (allowlist), never a `continue-on-error`.
#   filesystem:   Trivy over the repository (dependencies' known CVEs, Dockerfile and compose misconfigurations).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: new advisories appear without any commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (pinned versions)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --no-deps --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (runtime dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history: a secret removed later is still in it
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Pinned to the commit of v0.36.0 (the repository only has `v`-prefixed tags now; `0.28.0` no longer exists). A moving tag
      # would let whoever controls it change what runs here; bump the SHA together with the version comment.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0" # informational until the dependency upgrades above are done
