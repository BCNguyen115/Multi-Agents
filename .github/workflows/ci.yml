# CI: backend tests (with a real pgvector database for the RAG integration test), frontend checks, image builds.
# Not yet run on GitHub itself. Its steps were run locally in Linux containers that mirror the jobs (python:3.12 with a
# pgvector/pgvector:pg16 database for `backend`, node:20 for `frontend`): lint, `docker compose config`, and the frontend
# install/lint/tsc/tests/build all pass. The backend suite was last run on Windows against a scratch database of the
# compose Postgres (RAG_TEST_DSN set, so the real-database tests ran): 800 passed, 1 skipped, plus one process-spawn test
# that timed out under load and passes alone (its timeouts were raised). That run found three tests that left the
# database half-migrated or ignored the test DSN (fixed in tests/). The data agent has its own workflow: data-agent.yml.
# What a local run cannot show: GitHub-hosted runner differences (disk, caches, network) and the `images` job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # starts the whole workflow, plus the live routing eval, by hand (Actions tab -> CI -> Run workflow)
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC: the live routing eval (`orchestration-eval-live`), because a model update can change routing with no code change

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAG_TEST_DSN: postgresql://ci:ci@localhost:5432/ci
      LANGFUSE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
      - name: torch CPU build (as in the Dockerfile; PyPI's default wheel drags in ~5 GB of CUDA libraries nothing here uses)
        run: pip install "torch==$(grep -E '^torch==' requirements.lock | cut -d= -f3)" --index-url https://download.pytorch.org/whl/cpu
      - name: Install (pinned versions from requirements.lock)
        run: pip install -r requirements-dev.txt -c requirements.lock
      - name: spaCy model used by mem0's NLP extras
        run: |
          python -m spacy download en_core_web_sm \
            || pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Enable pgvector in the test database
        run: PGPASSWORD=ci psql -h localhost -U ci -d ci -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Lint (real bugs only, see pyproject.toml)
        run: ruff check src scripts tests
      - name: docker-compose.yml is valid (placeholders for the secrets it requires)
        run: docker compose config -q
        env:
          POSTGRES_PASSWORD: ci
          LANGFUSE_NEXTAUTH_SECRET: ci
          LANGFUSE_SALT: ci
          REDIS_PASSWORD: ci
          SANDBOX_SECRET: ci-sandbox-secret-0123456789
      - name: Tests (whole suite, real-database tests included because RAG_TEST_DSN is set)
        run: python -m pytest tests -q --cov=src --cov-report=term:skip-covered --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
      - name: Orchestration eval (routing decided by code must be 100 %, every tool trajectory must match; see dataset/routing_eval.json and trajectory_eval.json)
        run: python -m scripts.run_orchestration_eval --report reports/orchestration_eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orchestration-eval-report
          path: reports/orchestration_eval.*

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  e2e:
    # Browser tests (Playwright, Chromium) against `next dev`; the specs mock the API with page.route, so no backend is needed.
    # Ten specs predate the UI redesign and are left out in tests/e2e/playwright.config.ts (grepInvert) until they are rewritten.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/e2e/playwright.config.ts --project=chromium
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/tests/e2e/playwright-report

  deploy-config:
    # The deployment files must stay valid: Helm chart, Prometheus rules and config, Alertmanager config, the compose overrides.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci
      LANGFUSE_NEXTAUTH_SECRET: ci
      LANGFUSE_SALT: ci
      REDIS_PASSWORD: ci
      SANDBOX_SECRET: ci-sandbox-secret-0123456789
      METRICS_TOKEN: ci
    steps:
      - uses: actions/checkout@v4
      - name: Helm chart lints and renders (placeholders for the secrets it requires)
        run: |
          SETS="--set secrets.POSTGRES_URL=postgresql://u:p@db:5432/a --set secrets.REDIS_URL=redis://:p@r:6379/0 --set secrets.OPENROUTER_API_KEY=k --set secrets.AUTH_JWT_SECRET=0123456789abcdef0123456789abcdef --set secrets.SANDBOX_SECRET=0123456789abcdef"
          docker run --rm -v "$PWD/deploy/helm:/c:ro" alpine/helm:3.16.2 lint /c/agent-platform $SETS
          docker run --rm -v "$PWD/deploy/helm:/c:ro" alpine/helm:3.16.2 template agent /c/agent-platform $SETS --set ingress.enabled=true > /dev/null
          if docker run --rm -v "$PWD/deploy/helm:/c:ro" alpine/helm:3.16.2 template agent /c/agent-platform > /dev/null 2>&1; then echo "the chart must refuse to render without its required secrets"; exit 1; fi
      - name: Prometheus rules and config, Alertmanager config
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v2.55.1 check rules /etc/prometheus/alerts.yml
          docker run --rm --entrypoint sh -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v2.55.1 -c 'printf x > /tmp/metrics_token && promtool check config /etc/prometheus/prometheus.yml'
          docker run --rm --entrypoint amtool -v "$PWD/deploy/alertmanager:/c:ro" prom/alertmanager:v0.27.0 check-config /c/alertmanager.yml
      - name: Compose overrides are valid
        run: |
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.backup.yml config -q

  rag-eval:
    # Retrieval-quality gate (hit@5 / MRR of the planner mode on the real corpus and the hand-written questions). It runs on
    # every push, pull request and manual run: it ingests dataset/ with the embedding model, starts the TEI reranker and
    # calls OpenRouter (secret OPENROUTER_API_KEY), so it is slow and costs a few cents per run. The planner model and the HyDE
    # passage are not deterministic and 75 questions cannot resolve 0.1 (the report's own 95 % interval is about 0.2 wide): the SAME
    # corpus gave hit@5 0.587 / MRR 0.443 (docs/RAG_REVIEW_AND_FIXES.md), 0.533 / 0.334 (first run on GitHub) and 0.48 / 0.357
    # (a rerun on the files git tracks). So the thresholds are a FLOOR that catches a broken retrieval (embeddings or index gone:
    # numbers near 0.1), not a quality target; a real regression of a few points shows up in --baseline (create it with
    # --save-baseline from the average of several runs) and in the manual comparisons of docs/RAG_REVIEW_AND_FIXES.md. It cannot run where the secret is not available (pull requests from forks, and Dependabot's, which GitHub
    # gives no repository secrets): only those are left out, anything else with the secret missing FAILS in the first step.
    # Not yet run on GitHub: only its commands were run locally.
    if: >-
      github.event_name != 'schedule'
      && github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_URL: postgresql://ci:ci@localhost:5432/ci
      RERANKER_ENDPOINT: http://localhost:8080/rerank
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LANGFUSE_ENABLED: "false"
    steps:
      - name: The retrieval gate needs OPENROUTER_API_KEY (Settings > Secrets and variables > Actions)
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set: the retrieval gate cannot embed or plan without it. Add it as a repository secret."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
      - name: torch CPU build (as in the Dockerfile)
        run: pip install "torch==$(grep -E '^torch==' requirements.lock | cut -d= -f3)" --index-url https://download.pytorch.org/whl/cpu
      - name: Install (pinned versions from requirements.lock)
        run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Enable pgvector
        run: PGPASSWORD=ci psql -h localhost -U ci -d ci -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: TEI cross-encoder reranker (same image and model as docker-compose.yml)
        run: |
          docker run -d --name tei -p 8080:80 ghcr.io/huggingface/text-embeddings-inference:cpu-1.2 \
            --model-id BAAI/bge-reranker-base --auto-truncate
          for i in $(seq 1 60); do curl -sf http://localhost:8080/health && break; sleep 5; done
      - name: Ingest dataset/
        run: python -m scripts.run_ingestion
      - name: Retrieval gate
        run: python -m scripts.run_rag_eval --manual --rerank --min-hit5 0.45 --min-mrr 0.30 --baseline reports/rag_eval_baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-eval-report
          path: reports/rag_eval.*

  orchestration-eval-live:
    # How often the REAL planner model picks the right agent (all of dataset/routing_eval.json, the via=llm cases included), gated at
    # --min-routing 0.85 (measured 0.95 on 2026-10-12). It makes ~40 short OpenRouter calls (a few cents), so like `rag-eval` it runs on
    # every push, pull request, manual run and the weekly schedule, except where GitHub gives no repository secret (pull requests from
    # forks and Dependabot's): those are left out, and anything else with the secret missing FAILS in the first step instead of
    # passing without having tested anything. The deterministic half (rules + trajectories) already ran in `backend`.
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LANGFUSE_ENABLED: "false"
    steps:
      - name: The live routing eval needs OPENROUTER_API_KEY (Settings > Secrets and variables > Actions)
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set: the live planner cannot be called without it. Add it as a repository secret."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
      - name: torch CPU build (as in the Dockerfile)
        run: pip install "torch==$(grep -E '^torch==' requirements.lock | cut -d= -f3)" --index-url https://download.pytorch.org/whl/cpu
      - name: Install (pinned versions from requirements.lock)
        run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Routing accuracy of the real planner model
        run: python -m scripts.run_orchestration_eval --live --only routing --min-routing 0.85 --report reports/orchestration_eval_live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orchestration-eval-live-report
          path: reports/orchestration_eval_live.*
          if-no-files-found: ignore

  images:
    # Slow (dependency layers), so Chromium is left out (INSTALL_BROWSER=false). It runs on every push and pull request and does
    # not wait for `backend` / `frontend`: a Dockerfile that does not build is a finding of its own, and with `needs:` a red
    # test job turned this one into "Skipped".
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: INSTALL_BROWSER=false
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          push: false
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          build-args: API_URL=http://backend:8000
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
