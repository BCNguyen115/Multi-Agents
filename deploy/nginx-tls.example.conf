# TLS reverse proxy in front of the frontend: an EXAMPLE to adapt, not wired into docker-compose.yml.
#
# What it gives you
#   * HTTPS (the session cookie is then marked Secure by the frontend) and HSTS;
#   * the visitor's real address in X-Forwarded-For, OVERWRITTEN (never appended to what the client sent), so the backend's
#     flood guard sees individual visitors instead of one shared address;
#   * the frontend bound to loopback only: set FRONTEND_BIND=127.0.0.1 in .env.
#
# Wire it up
#   1. Run nginx on the host (or in a container with network_mode: host), certificates from your CA or Let's Encrypt.
#   2. .env:  FRONTEND_BIND=127.0.0.1   and   FORWARDED_ALLOW_IPS=<the address the backend sees the FRONTEND container from,
#      e.g. its Docker network: docker network inspect <project>_default>  (never "*" while port 8000 is reachable)
#   3. The frontend forwards X-Forwarded-For to the backend only on the sign-in, sign-up and password routes (lib/backendAuth.ts).
#
# Replace app.example.com and the certificate paths.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/ssl/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/app.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64m;   # above DATA_MAX_FILE_MB / KNOWLEDGE_MAX_FILE_MB

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: a client-supplied value must not survive
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE (/api/chat/stream): tokens must reach the browser as they are written
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
