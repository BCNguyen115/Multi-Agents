# Round-robin load balancer in front of several backend replicas (docker-compose.scale.yml).
# Docker's DNS name `backend` resolves to every replica; the resolver below re-reads it every 5 s, so replicas that are
# added, restarted or removed are noticed without reloading nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location / {
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE (/api/chat/stream): tokens must reach the browser as they are written
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 64m;

        # which replica answered: scripts/replica_check.py counts them
        add_header X-Upstream $upstream_addr always;
    }
}
