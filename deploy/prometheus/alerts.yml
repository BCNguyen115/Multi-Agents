# Alert rules. Thresholds are starting points for an internal pilot: tune them after a week of real traffic.
groups:
  - name: agent-platform
    rules:
      - alert: AgentBackendDown
        expr: up{job="agent-backend"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "The backend does not answer /metrics"
          description: "Prometheus could not scrape the backend for 2 minutes (down, or METRICS_TOKEN differs)."

      - alert: AgentHigh5xxRate
        expr: |
          sum(rate(agent_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(agent_http_requests_total[5m])), 1e-9) > 0.05
          and sum(rate(agent_http_requests_total[5m])) > 0.1
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "More than 5% of requests fail with a 5xx"
          description: "Look at the backend logs and GET /ready (Postgres, Redis, orchestrator)."

      - alert: AgentSlowResponses
        # chat and analysis legitimately take long; every other route should answer quickly
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(agent_http_request_duration_seconds_bucket{route!~"/api/chat.*|/api/analyze.*|/api/knowledge/upload|/api/dashboards/.*"}[5m]))) > 5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "p95 latency of ordinary routes is above 5 s"

      - alert: AgentLLMCostSpike
        # 5 USD in an hour is a placeholder: set it to what your pilot should cost at most
        expr: increase(agent_llm_cost_usd_total[1h]) > 5
        labels: {severity: warning}
        annotations:
          summary: "LLM spend in the last hour is above 5 USD"
          description: "See the cost report in /admin for who and which model."

      - alert: AgentTooManyRateLimited
        expr: sum(rate(agent_http_requests_total{status="429"}[5m])) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Requests are being rate limited continuously"

      - alert: AgentLoginFailuresHigh
        expr: sum(rate(agent_http_requests_total{route="/api/auth/login",status=~"401|429"}[5m])) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Many failed sign-ins: possible password guessing"
